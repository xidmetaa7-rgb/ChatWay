<!DOCTYPE html>
<html lang="ru"><head><link rel="stylesheet" href="chatway-design.css"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#6750a4"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="format-detection" content="telephone=no"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<title>ChatWay</title>
<style>
:root{--p:#6750a4;--op:#fff;--pc:#eaddff;--opc:#21005d;--s:#fef7ff;--sc:#f3edf7;--sch:#ece6f0;--t:#1d1b20;--t2:#49454f;--ol:#cac4d0;--mine:#d0bcff;--err:#b3261e;--on:#2e7d32;--msg-fs:16px}
@media(prefers-color-scheme:dark){:root:not([data-theme]){color-scheme:dark;--p:#d0bcff;--op:#381e72;--pc:#4f378b;--opc:#eaddff;--s:#141218;--sc:#211f26;--sch:#2b2930;--t:#e6e0e9;--t2:#cac4d0;--ol:#49454f;--mine:#4f378b;--err:#f2b8b5;--on:#66bb6a}}

[data-theme="violet"]{--p:#6750a4;--op:#fff;--pc:#eaddff;--opc:#21005d;--s:#fef7ff;--sc:#f3edf7;--sch:#ece6f0;--t:#1d1b20;--t2:#49454f;--ol:#cac4d0;--mine:#d0bcff;--err:#b3261e;--on:#2e7d32}
[data-theme="crimson"]{--p:#c62828;--op:#fff;--pc:#ffdad6;--opc:#410002;--s:#fff8f7;--sc:#fceeee;--sch:#f5e0df;--t:#201a19;--t2:#534341;--ol:#d8c2bf;--mine:#ffdad6;--err:#ba1a1a;--on:#2e7d32}
[data-theme="amber"]{--p:#b25e02;--op:#fff;--pc:#ffddb3;--opc:#291800;--s:#fff8f3;--sc:#faefe5;--sch:#f2e4d8;--t:#1f1b16;--t2:#4f4539;--ol:#d3c4b4;--mine:#ffddb3;--err:#ba1a1a;--on:#2e7d32}
[data-theme="emerald"]{--p:#1b6d3b;--op:#fff;--pc:#a6f5bc;--opc:#00210d;--s:#f6fbf4;--sc:#ebf3e9;--sch:#dfe8dd;--t:#181d18;--t2:#414941;--ol:#c1c9bf;--mine:#a6f5bc;--err:#ba1a1a;--on:#1b6d3b}
[data-theme="ocean"]{--p:#006494;--op:#fff;--pc:#cbe6ff;--opc:#001e30;--s:#f6fafe;--sc:#eaf1f8;--sch:#dfe7ef;--t:#181c20;--t2:#41474d;--ol:#c1c7ce;--mine:#cbe6ff;--err:#ba1a1a;--on:#2e7d32}
[data-theme="sand"]{--p:#8c5019;--op:#fff;--pc:#ffdcc1;--opc:#2e1500;--s:#fdf8f4;--sc:#f5ece4;--sch:#ebe0d6;--t:#201a15;--t2:#51443a;--ol:#d6c3b6;--mine:#ffdcc1;--err:#ba1a1a;--on:#2e7d32}
[data-theme="coffee"]{--p:#6f4e37;--op:#fff;--pc:#f5dcc8;--opc:#27170b;--s:#faf6f2;--sc:#f0e8e0;--sch:#e6dcd2;--t:#1e1b18;--t2:#4d453e;--ol:#cfc4ba;--mine:#e8cbb5;--err:#ba1a1a;--on:#2e7d32}
[data-theme="cyberpunk"]{color-scheme:dark;--p:#ff2a6d;--op:#fff;--pc:#4d1128;--opc:#ffd9e2;--s:#0d0d15;--sc:#161624;--sch:#222236;--t:#f0f0f8;--t2:#a0a0c0;--ol:#343452;--mine:#3b1645;--err:#ff5252;--on:#05d9e8}
[data-theme="midnight"]{color-scheme:dark;--p:#7aa2f7;--op:#15161e;--pc:#283457;--opc:#c0caf5;--s:#1a1b26;--sc:#16161e;--sch:#24283b;--t:#c0caf5;--t2:#787c99;--ol:#3b4261;--mine:#2e3c64;--err:#f7768e;--on:#9ece6a}
[data-theme="graphite"]{color-scheme:dark;--p:#e0e0e0;--op:#121212;--pc:#333333;--opc:#ffffff;--s:#121212;--sc:#1c1c1c;--sch:#2a2a2a;--t:#f5f5f5;--t2:#9e9e9e;--ol:#3d3d3d;--mine:#363636;--err:#cf6679;--on:#81c784}

*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:16px/1.4 Roboto,system-ui,sans-serif;background:var(--s);color:var(--t);overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.82) translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes redglow{0%,100%{color:var(--t);text-shadow:0 0 0 transparent}50%{color:#ff1744;text-shadow:0 0 12px #ff1744cc,0 0 30px #ff174477}}
@keyframes pl{50%{opacity:.5}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}70%{box-shadow:0 0 0 24px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.glow{animation:redglow 2.8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.glow{animation:none}.card,.card>*,.m.in,.main>*{animation:none!important}}
#app{display:flex;height:100%}
.side{width:100%;max-width:360px;background:var(--sc);display:flex;flex-direction:column;border-right:1px solid var(--ol)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}.main>*{animation:fade .3s}
@media(max-width:720px){.side{max-width:none}.main{display:none}body.chat .side{display:none}body.chat .main{display:flex;animation:slide .28s}}
@media(min-width:721px){.back{display:none}}
.top{display:flex;align-items:center;gap:2px;padding:10px 10px;background:var(--sc);min-height:62px;border-bottom:1px solid color-mix(in srgb, var(--ol) 40%, transparent);z-index:2}
.top h1{font-size:21px;margin:0;flex:1;font-weight:600;letter-spacing:.3px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ic{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;font-size:17px;flex:none;transition:background .2s,transform .15s}.ic:hover{background:var(--sch)}.ic:active{transform:scale(.88)}
.av-wrap{position:relative;flex:none;display:inline-flex}
.av{width:44px;height:44px;border-radius:50%;background:var(--pc);color:var(--opc);display:grid;place-items:center;font-weight:600;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}.av.xl{width:104px;height:104px;font-size:40px;margin:0 auto}.av.sm{width:34px;height:34px;font-size:14px}
.dot{position:absolute;right:1px;bottom:1px;width:12px;height:12px;border-radius:50%;background:var(--on);border:2px solid var(--sc)}
.list{flex:1;overflow:auto;padding:4px 8px}
.row{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;width:100%;text-align:left;transition:background .2s}
.row:hover,.row.on{background:var(--pc)}.row>div:nth-child(2){flex:1;min-width:0}.row .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.sub{font-size:13px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub.act{color:var(--p);font-weight:500}
.badge{background:var(--p);color:var(--op);border-radius:12px;min-width:22px;height:22px;padding:0 6px;display:grid;place-items:center;font-size:12px;font-weight:600;animation:pop .25s}
.hd{display:flex;gap:10px;align-items:center;flex:1;text-align:left;min-width:0}.hd>div:nth-child(2){min-width:0}

.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background-color:var(--s);background-size:cover;background-position:center;transition:background .3s;font-size:var(--msg-fs)}
.msgs[data-wp="grad1"]{background-image:linear-gradient(135deg,color-mix(in srgb,var(--p) 18%,var(--s)),color-mix(in srgb,var(--pc) 45%,var(--s)))}
.msgs[data-wp="grad2"]{background-image:radial-gradient(circle at top right,color-mix(in srgb,var(--p) 25%,transparent),transparent 60%),radial-gradient(circle at bottom left,color-mix(in srgb,var(--mine) 35%,transparent),transparent 60%)}
.msgs[data-wp="dots"]{background-image:radial-gradient(color-mix(in srgb,var(--t) 14%,transparent) 1.2px,transparent 1.2px);background-size:18px 18px}
.msgs[data-wp="grid"]{background-image:linear-gradient(to right,color-mix(in srgb,var(--t) 7%,transparent) 1px,transparent 1px),linear-gradient(to bottom,color-mix(in srgb,var(--t) 7%,transparent) 1px,transparent 1px);background-size:24px 24px}
.msgs[data-wp="sunset"]{background-image:linear-gradient(160deg,#ff9a9e33 0%,#fecfef33 50%,#a1c4fd33 100%)}
.msgs[data-wp="aurora"]{background-image:linear-gradient(135deg,#00c6ff22,#0072ff22,#7f00ff22)}

.m{max-width:78%;padding:8px 12px;border-radius:18px 18px 18px 4px;background:var(--sch);align-self:flex-start;word-wrap:break-word;position:relative;box-shadow:0 1px 2px #0001}
.m.me{align-self:flex-end;background:var(--mine);border-radius:18px 18px 4px 18px}
.m.del{opacity:.72;border:1px dashed var(--err)}
.m.enc{border-left:3px solid var(--on)}
.m.stk{background:transparent!important;box-shadow:none;padding:2px 4px}
.m.stk .stk-em{font-size:68px;line-height:1.1;display:block;filter:drop-shadow(0 3px 6px #0002);transition:transform .2s}.m.stk .stk-em:hover{transform:scale(1.08)}
.m.stk small{background:color-mix(in srgb,var(--sc) 80%,transparent);padding:2px 6px;border-radius:8px;display:inline-block;margin-top:2px}
.m.in{animation:pop .3s cubic-bezier(.2,.9,.3,1.2);transform-origin:bottom left}.m.me.in{transform-origin:bottom right}
.m img{max-width:100%;border-radius:12px;display:block;cursor:zoom-in}.m video{max-width:100%;border-radius:12px}
.m small{display:block;font-size:11px;color:var(--t2);text-align:right;margin-top:2px}.m .f{font-size:12px;color:var(--t2)}.m .who{font-size:12px;font-weight:600;color:var(--p)}
.m a{color:var(--p);font-weight:500}.m audio{max-width:100%;height:36px}
.fw{position:absolute;top:2px;right:-30px;opacity:0;font-size:17px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}.m.me .fw{right:auto;left:-30px}.m:hover .fw{opacity:1}.fw:hover{background:var(--sch)}
@media(hover:none){.fw{opacity:.65}}

.lazy-media{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--p) 14%,transparent);color:var(--p);font-size:14px;font-weight:500;text-align:left;width:100%}
.lazy-media:hover{background:color-mix(in srgb,var(--p) 22%,transparent)}
.saver-pill{font-size:11px;background:var(--pc);color:var(--opc);padding:2px 7px;border-radius:10px;font-weight:600;margin-right:2px}
.sec-pill{font-size:11px;background:var(--on);color:#fff;padding:2px 6px;border-radius:10px;font-weight:600;margin-right:2px}

.quick-bar{display:flex;gap:6px;padding:6px 10px 0;background:var(--sc);overflow-x:auto}
.quick-bar button{background:var(--sch);border-radius:14px;padding:4px 10px;font-size:12px;white-space:nowrap}
.stk-box{background:var(--sc);border-top:1px solid var(--ol);padding:10px;display:none;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px;max-height:210px;overflow-y:auto;animation:up .2s}
.stk-box.open{display:grid}
.stk-btn{font-size:36px;padding:6px;border-radius:14px;display:grid;place-items:center;transition:transform .15s,background .15s}.stk-btn:hover{background:var(--sch);transform:scale(1.12)}
.bar{display:flex;gap:3px;align-items:center;padding:8px 8px;background:var(--sc);border-top:1px solid color-mix(in srgb,var(--ol) 40%,transparent)}
.bar input[type=text]{flex:1;border:0;border-radius:24px;padding:10px 14px;background:var(--sch);color:var(--t);font:inherit;outline:0;min-width:0}
.send{background:var(--p);color:var(--op)}.rec{background:var(--err);color:#fff;animation:pl 1s infinite}
.blk{padding:14px;text-align:center;background:var(--sc);color:var(--t2)}
.empty{margin:auto;text-align:center;color:var(--t2);padding:24px}
.hero{margin:auto;text-align:center;padding:24px}.hero .big{font-size:68px;animation:bob 3s ease-in-out infinite}.hero h2{font-size:38px;margin:8px 0}
.fab{position:fixed;left:20px;bottom:calc(20px + env(safe-area-inset-bottom));background:var(--pc);color:var(--opc);border-radius:16px;padding:15px 20px;font-weight:500;box-shadow:0 3px 8px #0003;transition:transform .15s;z-index:2}.fab:active{transform:scale(.95)}
@media(min-width:721px){.fab{left:120px}}
dialog{border:0;border-radius:28px;background:var(--sc);color:var(--t);padding:22px;width:min(94vw,480px);max-height:88vh;overflow:auto}dialog[open]{animation:pop .25s}dialog::backdrop{background:#0006}
.f{width:100%;border:1px solid var(--ol);border-radius:12px;padding:12px 14px;background:transparent;color:var(--t);font:inherit;margin:6px 0;outline:0;resize:vertical}.f:focus{border-color:var(--p)}
.btn{background:var(--p);color:var(--op);border-radius:20px;padding:10px 22px;font-weight:500}.txt{color:var(--p);padding:8px 14px;font-weight:500}.danger{color:var(--err)}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chips button{background:var(--sch);border-radius:14px;padding:5px 12px;font-size:13px}

.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.th-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;border:1.5px solid var(--ol);text-align:left;font-size:13px;transition:.15s}
.th-item.on{border-color:var(--p);background:var(--pc);color:var(--opc);font-weight:600}
.th-dot{width:18px;height:18px;border-radius:50%;flex:none;border:1px solid #0002}
.wp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.wp-item{height:54px;border-radius:12px;border:2px solid var(--ol);display:grid;place-items:center;font-size:11px;font-weight:500;overflow:hidden;position:relative}
.wp-item.on{border-color:var(--p);box-shadow:0 0 0 2px var(--p)}

.apps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.app-tile{background:var(--sch);border-radius:18px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:1px solid color-mix(in srgb,var(--ol) 45%,transparent);transition:.15s;position:relative}
.app-tile:hover{background:var(--pc);transform:translateY(-2px)}
.app-ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--s);box-shadow:0 2px 6px #0001}
.app-name{font-size:12px;font-weight:600;line-height:1.2;word-break:break-word}
.app-tag{font-size:9px;background:var(--p);color:var(--op);padding:1px 6px;border-radius:6px}
.app-tag.ok{background:var(--on);color:#fff}
.app-del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:var(--err);color:#fff;font-size:12px;display:grid;place-items:center}

.mod-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:14px;background:var(--sch);margin-bottom:8px;transition:opacity .2s}
.mod-row.disabled{opacity:.48;pointer-events:none}
.mod-row b{display:block;font-size:14px}
.mod-row span{font-size:12px;color:var(--t2);display:block}
.sw{width:44px;height:26px;border-radius:13px;background:var(--ol);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--p)}
.sw.on::after{left:21px}

.sec-box{background:var(--sch);border-radius:16px;padding:12px;margin-bottom:10px;border:1px solid color-mix(in srgb,var(--ol) 50%,transparent)}
.sec-box h4{margin:0 0 6px;font-size:14px;display:flex;align-items:center;justify-content:space-between}
.sec-status{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--pc);color:var(--opc);font-weight:600}
.sec-status.good{background:var(--on);color:#fff}

.vc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.vc-btn{padding:10px;border-radius:14px;background:var(--sch);border:1.5px solid var(--ol);text-align:left;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;transition:.15s}
.vc-btn.on{border-color:var(--p);background:var(--pc);color:var(--opc);font-weight:600}

.su-card{background:var(--sch);border:1.5px solid var(--ol);border-radius:16px;padding:12px;margin-bottom:10px}
.su-card.on{border-color:var(--p)}
.su-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.su-title-inp{border:1px solid var(--ol);border-radius:10px;padding:6px 10px;background:var(--s);color:var(--t);font-weight:600;font-size:14px;flex:1;min-width:0}

#auth{position:fixed;inset:0;background:var(--s);z-index:5;display:none;align-items:center;justify-content:center;padding:16px}
.card{background:var(--sc);border-radius:28px;padding:28px;width:min(100%,400px);animation:up .7s cubic-bezier(.2,.8,.2,1)}
.card h2{margin:0 0 4px;font-size:34px;font-weight:600}
.tabs{display:flex;gap:4px;margin:10px 0}.tabs button{flex:1;padding:8px;border-radius:20px;color:var(--t2);transition:background .25s;font-size:13px}.tabs .on{background:var(--pc);color:var(--opc);font-weight:600}

#call{position:fixed;inset:0;background:#0b0a0f;color:#fff;z-index:22;display:none;flex-direction:column;transition:border-radius .25s,box-shadow .25s;overflow:hidden}
#call.mini{inset:auto 14px 82px auto;width:154px;height:224px;border-radius:20px;box-shadow:0 12px 32px #0009;border:2px solid var(--p);cursor:grab}
#call.mini .call-top,#call.mini .call-ctrls,#call.mini #lv{display:none!important}
#call.mini #audioUi{padding:10px;gap:6px}
#call.mini #audioUi .av.xl{width:54px;height:54px;font-size:22px}
#call.mini #callName{font-size:14px!important}
#call.mini #callState{font-size:12px!important}
.call-top{position:absolute;top:0;left:0;right:0;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,#0009,transparent);z-index:4}
.call-top-info{text-align:center;flex:1;min-width:0;padding:0 8px}
#rv{flex:1;min-height:0;width:100%;height:100%;object-fit:cover;background:#000}
#lv{position:absolute;right:14px;top:calc(74px + env(safe-area-inset-top));width:108px;height:156px;border-radius:16px;background:#1c1c24;z-index:4;object-fit:cover;border:2px solid #ffffff44;box-shadow:0 6px 20px #0008;transition:width .25s,height .25s,opacity .25s;cursor:pointer}
#lv.shrink{width:64px;height:92px;opacity:.85}
#lv.mirror{transform:scaleX(-1)}
#audioUi{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at center,#2a2140 0%,#0f0e13 75%);padding:24px;text-align:center}
#audioUi .pulse{border-radius:50%;animation:pulseRing 2s infinite}
.call-ctrls{position:absolute;bottom:0;left:0;right:0;display:flex;gap:12px;justify-content:center;align-items:center;padding:18px 14px calc(22px + env(safe-area-inset-bottom));background:linear-gradient(to top,#000c,transparent);z-index:4}
.call-btn{width:48px;height:48px;border-radius:50%;background:#ffffff24;backdrop-filter:blur(8px);color:#fff;font-size:19px;display:grid;place-items:center;transition:.15s}
.call-btn:active{transform:scale(.9)}
.call-btn.on{background:var(--p);color:var(--op)}
.call-btn.off{background:#fff;color:#111}
#call .end{background:#e53935;color:var(--op);width:56px;height:56px;border-radius:50%;font-size:24px;display:grid;place-items:center}

#webAppModal,#browserModal{position:fixed;inset:0;background:var(--s);z-index:12;display:none;flex-direction:column}
.yt-bar{display:flex;gap:6px;align-items:center;padding:10px 12px;background:var(--sc);border-bottom:1px solid var(--ol)}

#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--t);color:var(--s);padding:10px 18px;border-radius:12px;display:none;z-index:30;max-width:90vw;text-align:center}
.mr{display:flex;gap:10px;align-items:center;padding:6px 0}

/* ===== ChatWay: animations + mobile-app layer ===== */
:root{--ease:cubic-bezier(.2,.8,.2,1)}
html{-webkit-tap-highlight-color:transparent;overscroll-behavior:none;scrollbar-width:thin}
body{height:100dvh;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;touch-action:manipulation;transition:background-color .35s,color .35s}
.top,.row,.ic,.btn,.txt,.fab,.tabs,.chips,.app-tile,.stk-btn{-webkit-user-select:none;user-select:none}
.m,input,textarea{-webkit-user-select:text;user-select:text}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,18px) scale(.94)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes backIn{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes modalIn{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
@keyframes callIn{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
@keyframes dotPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--on) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}}
@keyframes rip{from{transform:scale(0);opacity:.28}to{transform:scale(1);opacity:0}}
@keyframes langFade{from{opacity:.2;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:-200% 0}}
@keyframes splashPop{from{opacity:0;transform:scale(.4) rotate(-14deg)}to{opacity:1;transform:none}}
@keyframes fabIn{from{opacity:0;transform:translateY(46px) scale(.7)}to{opacity:1;transform:none}}
